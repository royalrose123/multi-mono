# 以下 secret 只供 demo，不得用於正式環境。
name: order-invoice

x-app-env: &app-env
  AUTH_SECRET: demo-only-auth-secret-change-me-0123456789
  REVALIDATE_TOKEN: demo-only-revalidate-token

services:
  order:
    build:
      context: .
      dockerfile: apps/order/Dockerfile
      args:
        INVOICE_ZONE_URL: http://invoice:3001
    ports: ["8080:3000"]
    environment:
      <<: *app-env
      MENU_FILE: /config/menu.json
    # order 每次請求都讀 menu.json：改 deploy/menu.json 立即生效，不用重啟。
    # 掛整個資料夾而不是單一檔案：編輯器用「寫新檔再改名」存檔時，單檔掛載會失效
    volumes: ["./deploy:/config:ro"]
    depends_on: [invoice]

  invoice:
    build:
      context: .
      dockerfile: apps/invoice/Dockerfile
    expose: ["3001"]
    environment:
      <<: *app-env
      # 經 compose 內網向 order 取得 menu（快取 60 秒）
      MENU_CONFIG_URL: http://order:3000/api/menu
